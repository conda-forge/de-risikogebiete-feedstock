schema_version: 1

context:
  name: de-risikogebiete
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/de-risikogebiete-${{ version }}.tar.gz
  sha256: 9246adea4acf68fc8bce7174e813857c107086fc19f5a7ad78ff6dab284416c6

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - poetry
  run:
    - python >=${{ python_min }}
    - python-dateutil
    - urllib3 >=1.25.3

tests:
  - python:
      imports:
        - deutschland.risikogebiete
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: "Robert Koch Institut: Corona Risikogebiete API"
  license: Apache-2.0
  license_file:
    - LICENSE
  homepage: https://github.com/bundesAPI/risikogebiete-api

extra:
  recipe-maintainers:
    - jan-janssen
